services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Etc/UTC
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}          # Your Surfshark OpenVPN username
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}  # Your Surfshark OpenVPN password
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-Taiwan}  # Optional: keep Taiwan or change
      # DNS configuration - use Cloudflare DNS for reliable resolution
      - DNS_ADDRESS=1.1.1.1
      - DNS_ADDRESS_BLOCK_MALICIOUS=false
      - DNS_ADDRESS_BLOCK_SURVEILLANCE=false
      - DNS_ADDRESS_BLOCK_ADS=false
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider --quiet --timeout=5 https://cloudflare.com || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  travel-tip-demo:
    image: southerndocker800/travel-tip-demo:v1.6
    container_name: travel-tip-demo
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: service:gluetun
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - GOOGLE_FLIGHTS_API_KEY=${GOOGLE_FLIGHTS_API_KEY}
      - N8N_READ_TIMEOUT_SECONDS=7200
    restart: unless-stopped

volumes:
  open-webui-data: