services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Etc/UTC
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}          # Your Surfshark OpenVPN username
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}  # Your Surfshark OpenVPN password
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-Taiwan}  # Optional: keep Taiwan or change
    ports:
      - "8080:8080"
    restart: unless-stopped

  travel-tip-demo:
    image: southerndocker800/travel-tip-demo:v1.6
    container_name: travel-tip-demo
    depends_on:
      gluetun:
        condition: service_started
    network_mode: service:gluetun
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - GOOGLE_FLIGHTS_API_KEY=${GOOGLE_FLIGHTS_API_KEY}
      - N8N_READ_TIMEOUT_SECONDS=7200
    restart: unless-stopped

volumes:
  open-webui-data: