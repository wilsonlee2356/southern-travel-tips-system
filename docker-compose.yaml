services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Etc/UTC
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}          # Your Surfshark OpenVPN username
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}  # Your Surfshark OpenVPN password
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-Taiwan}  # Optional: keep Taiwan or change
      # DNS configuration - use Google DNS for reliable resolution
      - DNS=8.8.8.8,8.8.4.4
      - DNS_KEEP_NAMESERVER=off
      # Health check target
      - HEALTH_TARGET_ADDRESS=cloudflare.com:443
      # OpenVPN verbosity for debugging (can be removed after confirming it works)
      - OPENVPN_VERBOSITY=1
      # Bypass VPN for local network (including n8n at 192.168.0.2)
      # This prevents 60-second timeout since n8n doesn't need VPN access
      # All traffic to 192.168.0.0/24 (your local network) will bypass VPN
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/24
    sysctls:
      # TCP keepalive settings to prevent Surfshark VPN from timing out idle connections during long n8n requests (up to 45+ minutes)
      # These sysctls control when TCP keepalive probes are sent IF keepalive is enabled on the socket.
      # Note: Python's httpx/httpcore may not enable keepalive by default. If timeouts persist, 
      # you may need to set these sysctls at the host system level or enable keepalive in the application.
      # Verify they're applied: docker exec gluetun cat /proc/sys/net/ipv4/tcp_keepalive_time
      # tcp_keepalive_time: seconds before sending first keepalive probe (default 7200, set to 30)
      - net.ipv4.tcp_keepalive_time=30
      # tcp_keepalive_intvl: seconds between keepalive probes (default 75, set to 10)
      - net.ipv4.tcp_keepalive_intvl=10
      # tcp_keepalive_probes: number of probes before considering connection dead (default 9, set to 5)
      - net.ipv4.tcp_keepalive_probes=5
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider --quiet --timeout=5 https://cloudflare.com || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  travel-tip-demo:
    image: southerndocker800/travel-tip-demo:v1.6
    container_name: travel-tip-demo
    depends_on:
      gluetun:
        condition: service_started
    network_mode: service:gluetun
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - GOOGLE_FLIGHTS_API_KEY=${GOOGLE_FLIGHTS_API_KEY}
      - VITE_GOOGLE_FLIGHTS_API_KEY=${GOOGLE_FLIGHTS_API_KEY}
      - N8N_READ_TIMEOUT_SECONDS=7200  # 2 hours timeout for n8n requests (some take 45+ minutes)
      # No N8N_PROXY_URL needed - app connects directly to n8n.ssl-labs.ai which goes through your nginx proxy
    restart: unless-stopped

volumes:
  open-webui-data: