events {
    worker_connections 1024;
}

http {
    # Upstream to n8n webhook (nginx routes through gluetun VPN)
    upstream n8n_backend {
        server n8n.ssl-labs.ai:443;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 7200s;
    }

    server {
        listen 8090;
        server_name _;

        # TCP keepalive for upstream connections (critical for VPN - prevents 60s timeout)
        proxy_socket_keepalive on;
        
        # Long timeouts for n8n requests (45+ minutes)
        proxy_connect_timeout 30s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        send_timeout 7200s;

        # HTTP keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        location /webhook/ {
            proxy_pass https://n8n_backend;
            proxy_set_header Host n8n.ssl-labs.ai;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSL settings
            proxy_ssl_verify on;
            proxy_ssl_server_name on;
        }
    }
}

