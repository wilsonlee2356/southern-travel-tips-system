version: '3.8'

services:
  finetune-backend:
    build:
      context: .
      dockerfile: Dockerfile.finetune
      args:
        USE_CUDA: ${USE_CUDA:-false}
        USE_CUDA_VER: ${USE_CUDA_VER:-cu121}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: finetune-backend
    ports:
      - "8001:8001"
    environment:
      # Fine-tuning API configuration
      - FINETUNE_API_HOST=0.0.0.0
      - FINETUNE_API_PORT=8001
      - FINETUNE_LOG_LEVEL=${FINETUNE_LOG_LEVEL:-INFO}
      - FINETUNE_MAX_WORKERS=${FINETUNE_MAX_WORKERS:-4}
      - FINETUNE_TIMEOUT=${FINETUNE_TIMEOUT:-14400}
      
      # CUDA configuration
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
      - USE_CUDA_DOCKER=${USE_CUDA:-false}
      
      # Cache directories
      - HF_HOME=/app/cache/huggingface
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - TORCH_HOME=/app/cache/torch
      
      # Python configuration
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      
      # Ollama configuration (if using external Ollama)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      
    volumes:
      # Persist training data and models
      - finetune_data:/app/backend/data
      - finetune_logs:/app/backend/training_logs
      - finetune_adapters:/app/backend/adapter_exports
      - finetune_merged:/app/backend/merged_models
      - finetune_rag:/app/backend/rag_models
      
      # Cache directories for faster subsequent builds
      - finetune_cache_hf:/app/cache/huggingface
      - finetune_cache_transformers:/app/cache/transformers
      - finetune_cache_torch:/app/cache/torch
      
      # Optional: Mount local models directory
      - ${LOCAL_MODELS_PATH:-./models}:/app/models:ro
      
    networks:
      - finetune-network
      
    # Resource limits (adjust based on your hardware)
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-16G}
          cpus: ${CPU_LIMIT:-8.0}
        reservations:
          memory: ${MEMORY_RESERVATION:-8G}
          cpus: ${CPU_RESERVATION:-4.0}
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Restart policy
    restart: unless-stopped
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Optional: GPU support (uncomment if using GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Optional: Ollama service for model inference
  ollama:
    image: ollama/ollama:latest
    container_name: finetune-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - finetune-network
    restart: unless-stopped
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: finetune-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - finetune-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: finetune-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - finetune-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: finetune-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - finetune-network
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}

volumes:
  # Fine-tuning data volumes
  finetune_data:
    driver: local
  finetune_logs:
    driver: local
  finetune_adapters:
    driver: local
  finetune_merged:
    driver: local
  finetune_rag:
    driver: local
  
  # Cache volumes
  finetune_cache_hf:
    driver: local
  finetune_cache_transformers:
    driver: local
  finetune_cache_torch:
    driver: local
  
  # Service volumes
  ollama_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  finetune-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
